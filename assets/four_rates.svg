<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="The same grievances give four success rates">
<style>.b{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:g 1.1s forwards cubic-bezier(.2,.8,.2,1)}@keyframes g{to{transform:scaleX(1)}}
.v{opacity:0;animation:f .5s forwards}@keyframes f{to{opacity:1}}</style>
<rect width="1200" height="380" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="40" y="50" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="700" fill="#0f172a">The same grievances, four success rates</text>
<text x="40" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#64748b">What counts as success decides the verdict. Central Ministries 2026 and Group 5 citizen cohort</text>
<text x="40" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">Disposed on portal</text>
<rect x="330" y="98" width="760" height="32" rx="8" fill="#f1f5f9"/>
<rect x="330" y="98" width="760.0" height="32" rx="8" fill="#2a78d6" class="b" style="animation-delay:0.30s"/>
<text x="1100.0" y="120" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="700" fill="#0f172a" class="v" style="animation-delay:1.10s">100%</text><text x="40" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">Confirmed resolved, DARPG calls</text>
<rect x="330" y="164" width="760" height="32" rx="8" fill="#f1f5f9"/>
<rect x="330" y="164" width="311.1" height="32" rx="8" fill="#5b9be3" class="b" style="animation-delay:0.65s"/>
<text x="651.1" y="186" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="700" fill="#0f172a" class="v" style="animation-delay:1.45s">40.94%</text><text x="40" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">Resolved and satisfied</text>
<rect x="330" y="230" width="760" height="32" rx="8" fill="#f1f5f9"/>
<rect x="330" y="230" width="248.7" height="32" rx="8" fill="#1baf7a" class="b" style="animation-delay:1.00s"/>
<text x="588.7" y="252" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="700" fill="#0f172a" class="v" style="animation-delay:1.80s">32.72%</text><text x="40" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">Substantively fixed, our cohort</text>
<rect x="330" y="296" width="760" height="32" rx="8" fill="#f1f5f9"/>
<rect x="330" y="296" width="63.1" height="32" rx="8" fill="#eb6834" class="b" style="animation-delay:1.35s"/>
<text x="403.1" y="318" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="700" fill="#0f172a" class="v" style="animation-delay:2.15s">8.3%</text>
<text x="40" y="360" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Headline satisfaction is 79.91% because it divides satisfied citizens by resolved ones only. Divided by everyone reached it is 32.72%.</text>
</svg>