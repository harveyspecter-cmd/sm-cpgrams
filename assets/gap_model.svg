<rect x="60" y="132" width="330" height="70" rx="12" fill="#fdeee7" stroke="#eb6834" stroke-width="1.8"/><text x="78" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#b8461a">Expected service</text><text x="78" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#334155">7 days and the problem fixed</text><rect x="60" y="212" width="330" height="64" rx="12" fill="#fdeee7" stroke="#eb6834" stroke-width="1.8"/><text x="78" y="242" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#b8461a">Perceived service</text><text x="78" y="266" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#334155">8.3% fixed, fairness 1.0 of 5</text><rect x="800" y="132" width="340" height="70" rx="12" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.8"/><text x="818" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1d5fae">Management view</text><text x="818" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#334155">speed, clearance and GRAI rank</text><rect x="800" y="310" width="340" height="70" rx="12" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.8"/><text x="818" y="340" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1d5fae">Service standard</text><text x="818" y="364" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#334155">21 days, interim reply if longer</text><rect x="800" y="460" width="340" height="70" rx="12" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.8"/><text x="818" y="490" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1d5fae">Actual delivery</text><text x="818" y="514" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#334155">14.3 pp closed without an ATR</text><rect x="60" y="460" width="330" height="70" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="78" y="490" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#334155">Communication to citizens</text><text x="78" y="514" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#334155">0% informative interim replies</text><line x1="392" y1="167" x2="796" y2="167" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
