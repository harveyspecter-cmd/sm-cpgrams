<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="1200" height="310" role="img" aria-label="Four mechanisms behind the contrast">
<style>.m{opacity:0;animation:p .6s forwards}@keyframes p{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}</style>
<rect width="1200" height="310" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="40" y="50" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="700" fill="#0f172a">Why the two lenses disagree</text>
<text x="40" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#64748b">Four mechanisms, each measured in the data</text>
<g class="m" style="animation-delay:0.2s"><rect x="40" y="96" width="265" height="190" rx="14" fill="#fff" stroke="#e2e8f0"/>
<circle cx="74" cy="132" r="18" fill="#2a78d6"/><text x="74" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">1</text>
<text x="58" y="182" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#0f172a" font-weight='700'><tspan x="58" dy="0">Closure is counted,</tspan><tspan x="58" dy="25">not resolution</tspan></text><text x="58" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#475569"><tspan x="58" dy="0">Headline satisfaction 79.91%,</tspan><tspan x="58" dy="18">true satisfaction 32.72%</tspan></text></g><path d="M308,191 l12,0" stroke="#94a3b8" stroke-width="2" class="m" style="animation-delay:0.4s"/><g class="m" style="animation-delay:0.6s"><rect x="325" y="96" width="265" height="190" rx="14" fill="#fff" stroke="#e2e8f0"/>
<circle cx="359" cy="132" r="18" fill="#2a78d6"/><text x="359" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">2</text>
<text x="343" y="182" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#0f172a" font-weight='700'><tspan x="343" dy="0">The mean hides the</tspan><tspan x="343" dy="25">tail</tspan></text><text x="343" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#475569"><tspan x="343" dy="0">14.3% of completions pass 21</tspan><tspan x="343" dy="18">days, p95 47.2 days</tspan></text></g><path d="M593,191 l12,0" stroke="#94a3b8" stroke-width="2" class="m" style="animation-delay:0.8s"/><g class="m" style="animation-delay:1.0s"><rect x="610" y="96" width="265" height="190" rx="14" fill="#fff" stroke="#e2e8f0"/>
<circle cx="644" cy="132" r="18" fill="#eb6834"/><text x="644" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">3</text>
<text x="628" y="182" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#0f172a" font-weight='700'><tspan x="628" dy="0">Hand offs kill</tspan><tspan x="628" dy="25">resolution</tspan></text><text x="628" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#475569"><tspan x="628" dy="0">0 of 18 reassigned cases</tspan><tspan x="628" dy="18">fixed, Fisher p = 0.026</tspan></text></g><path d="M878,191 l12,0" stroke="#94a3b8" stroke-width="2" class="m" style="animation-delay:1.2s"/><g class="m" style="animation-delay:1.4s"><rect x="895" y="96" width="265" height="190" rx="14" fill="#fff" stroke="#e2e8f0"/>
<circle cx="929" cy="132" r="18" fill="#eb6834"/><text x="929" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">4</text>
<text x="913" y="182" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#0f172a" font-weight='700'><tspan x="913" dy="0">The standard lags</tspan><tspan x="913" dy="25">expectation</tspan></text><text x="913" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#475569"><tspan x="913" dy="0">Citizens expect 7 days, the</tspan><tspan x="913" dy="18">rule promises 21</tspan></text></g>
</svg>